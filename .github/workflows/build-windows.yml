name: Build Windows Application

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Desktop
        run: npm --workspace=desktop run typecheck

      - name: Build Desktop (Vite & TSC)
        run: npm --workspace=desktop run build

      - name: Package Windows Installer & Portable (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aquality-Music-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml

      - name: Attach Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "Uploading Windows assets to release $VERSION..."
          gh release upload "$VERSION" desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest.yml --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
