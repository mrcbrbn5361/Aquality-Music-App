name: Build macOS Application

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and macOS 7zip
        run: |
          npm install
          brew install p7zip
          P7ZA=$(which 7za || which 7z)
          ln -sf "$P7ZA" ./7za
          ln -sf "$P7ZA" ./desktop/7za
          chmod +x ./7za ./desktop/7za 2>/dev/null || true
          for dir in node_modules/7zip-bin/mac/arm64 node_modules/7zip-bin/mac/x64 desktop/node_modules/7zip-bin/mac/arm64 desktop/node_modules/7zip-bin/mac/x64; do
            mkdir -p "$dir"
            cp "$P7ZA" "$dir/7za"
            chmod +x "$dir/7za"
          done

      - name: Build desktop and package macOS DMG
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_7ZA: "true"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aquality-Music-macOS
          path: |
            desktop/release/*.dmg
            desktop/release/*.blockmap

      - name: Attach macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          gh release upload v1.0.0 desktop/release/*.dmg --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
